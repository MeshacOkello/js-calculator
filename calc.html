<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calc.css">
    <title>Calculator</title>
</head>
<body>
    <div id = "calc">
        <div id = "display" class = "sections">5+7</div>
        <div id = "nonNumeric" class = "sections">
            <button class="btn">(</button>
            <button class="btn">)</button>
            <button class="btn">x^2</button>
            <button class="btn">x^3</button>
            <button class="btn">x^y</button>
            <button class="btn">e^x</button>
            <button class="btn">10^x</button>
            <button class="btn">sqrt</button>
            <button class="btn">cbrt</button>
            <button class="btn">nthRT</button>
            <button class="btn">ln</button>
            <button class="btn">log</button>
            <button class="btn">x!</button>
            <button class="btn">sin</button>
            <button class="btn">cos</button>
            <button class="btn">tan</button>
            <button class="btn">e</button>
            <button class="btn">pi</button>
        </div>
        <div id = numericArithmetic class = "sections">
            <div id = "numeric">
                <button class="btn">del</button>
                <button class="btn">%</button>
                <button class="btn">7</button>
                <button class="btn">8</button>
                <button class="btn">9</button>
                <button class="btn">4</button>
                <button class="btn">5</button>
                <button class="btn">6</button>
                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="btn">0</button>
                <button class="btn">.</button>
            </div>
            <div id = "arithmetic">
                <button class = "btn">/</button>
                <button class = "btn">*</button>
                <button class = "btn">-</button>
                <button class = "btn">+</button>
                <button class = "btn">=</button>
            </div>
        </div>
    </div>
    <script src = "calc.js"></script>
</body>
</html>
